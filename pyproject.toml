[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-memorization"
version = "0.2.0"
description = "A reproducible symmetry-controlled modular addition study"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["reportlab>=4", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
